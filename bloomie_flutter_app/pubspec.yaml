name: bloomie_flutter_app
description: Bloomie - Flower Shop Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI Components
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  carousel_slider: ^4.2.1
  flutter_rating_bar: ^4.0.1
  badges: ^3.1.2
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0

  # HTTP & API
  dio: ^5.4.0
  http: ^1.1.2
  pretty_dio_logger: ^1.3.1

  # State Management
  provider: ^6.1.1

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^12.1.3

  # Forms & Validation
  form_field_validator: ^1.1.0
  email_validator: ^2.1.17

  # Image Handling
  image_picker: ^1.0.5
  image_cropper: ^5.0.1
  flutter_image_compress: ^2.1.0

  # Date & Time
  intl: ^0.19.0
  timeago: ^3.6.0

  # Utils
  url_launcher: ^6.2.2
  share_plus: ^7.2.1
  flutter_dotenv: ^5.1.0
  uuid: ^4.2.2
  equatable: ^2.0.5

  # Firebase (Optional)
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.9
  # firebase_analytics: ^10.7.4

  # Payment Gateways (nếu cần)
  # flutter_stripe: ^10.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  # Fonts (nếu dùng custom fonts)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
  #       - asset: assets/fonts/Roboto-Bold.ttf
  #         weight: 700
